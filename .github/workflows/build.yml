name: NodeJS with jest test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

#on:
  #workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Build
      working-directory: ./lab8jest
      run: npm install

    - name: Test
      working-directory: ./lab8jest
      run: npm run test

